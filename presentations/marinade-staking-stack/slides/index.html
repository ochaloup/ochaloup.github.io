<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<!-- Browser tab and PDF export name. Carries the descriptive line the cover does not. -->
		<title>Inside Marinade's staking stack: liquid, native, and getting out early</title>

		<link rel="stylesheet" href="dist/reset.css" />
		<link rel="stylesheet" href="dist/reveal.css" />
		<link rel="stylesheet" href="dist/theme/black.css" />
		<link rel="stylesheet" href="theme/marinade.css" />

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section
					data-markdown="deck.md"
					data-separator="^\r?\n---\r?\n$"
					data-separator-vertical="^\r?\n--\r?\n$"
					data-separator-notes="^Note:"
					data-charset="utf-8"
				></section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="dist/plugin/notes.js"></script>
		<script src="dist/plugin/markdown.js"></script>
		<script src="dist/plugin/highlight.js"></script>
		<script>
			Reveal.initialize({
				// Canonical Marinade slide size, keeps the cookbook's pt scale honest.
				width: 1920,
				height: 1080,
				// Zero, because the theme's own 80px grid margin is the breathing room.
				// Any canvas margin shows as a band around full-bleed backgrounds.
				margin: 0,
				// Archetypes anchor the title upper-left, so no vertical centering by default.
				center: false,
				hash: true,
				slideNumber: false,
				transition: "fade",
				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});

			// The SOL's journey. A slide opts in with data-stage="auction", or "all".
			// One rail per section, so each product shows only the stages it actually has.
			// Bond before Auction: a validator has to fund a bond before it can bid.
			const RAILS = {
				liquid: ["Stake", "Bond", "Auction", "Settle"],
				native: ["Stake", "Exit"],
				instant: ["Stake", "Exit"],
			};

			function addJourney(section) {
				const stage = section.dataset.stage;
				if (!stage) return;
				const stages = RAILS[section.dataset.rail || "liquid"];
				if (!stages) return;
				const current = stages.findIndex((s) => s.toLowerCase() === stage.toLowerCase());
				if (current < 0 && stage !== "all") return;

				const rail = document.createElement("nav");
				rail.className = stage === "all" ? "journey all" : "journey";
				rail.setAttribute("aria-hidden", "true");
				for (const [i, name] of stages.entries()) {
					const node = document.createElement("span");
					node.className = `j ${i < current ? "past" : i === current ? "now" : "next"}`;
					node.textContent = name;
					rail.append(node);
				}
				section.prepend(rail);
				section.classList.add("has-journey");
			}

			// Heading stays pinned top, everything under it becomes one centreable block.
			function wrapBody(section) {
				if (section.matches(".vcenter, .cover")) return;
				const body = [...section.children].filter(
					(el) =>
						!el.matches(
							"aside.notes, .journey, h1, h2, .label, .stamp, .side-art, .watermark, .slide-icon, .lockup, .brand-mark, .slide-foot, .gears, .ladder",
						),
				);
				if (!body.length) return;
				const wrapper = document.createElement("div");
				wrapper.className = "slide-body";
				section.insertBefore(wrapper, body[0]);
				wrapper.append(...body);
			}

			// The art scrim belongs to the background, so it does not fade with the text.
			function markArtBackground(section) {
				if (!section.classList.contains("art")) return;
				Reveal.getSlideBackground(section)?.classList.add("art-bg");
			}

			// Never navigate the deck away mid-talk. Reveal's own #/ links are left alone.
			function externalLinksInNewTab() {
				for (const link of document.querySelectorAll('.reveal a[href^="http"]')) {
					link.target = "_blank";
					link.rel = "noopener noreferrer";
				}
			}

			/*
			 * Rehearsal timing, opt in with ?rehearse=1 so the live deck is untouched.
			 * Records how long each slide was actually on screen, because the thing that
			 * overruns is never the slide you expect.
			 */
			function rehearsalTiming() {
				if (!new URLSearchParams(location.search).has("rehearse")) return;

				const log = [];
				let current = null;
				let lastSave = 0;

				const hud = document.createElement("div");
				hud.style.cssText =
					"position:fixed;right:12px;bottom:10px;z-index:60;font:600 20px/1 'DM Sans',sans-serif;" +
					"color:#94c9c8;background:rgba(21,26,26,.8);padding:8px 12px;border-radius:8px";
				document.body.appendChild(hud);

				const headingOf = (section) =>
					(section.querySelector("h1, h2")?.textContent || "(picture)").trim();

				const seconds = (from, to) => Math.round((to - from) / 100) / 10;

				function open(section) {
					const now = performance.now();
					if (current) {
						log.push({ n: current.n, heading: current.heading, seconds: seconds(current.start, now) });
					}
					current = { n: Reveal.getIndices(section).h, heading: headingOf(section), start: now };
				}

				/*
				 * Saving must never end the current slide's measurement. An earlier version
				 * closed the entry, so an autosave in the middle of a long slide truncated it
				 * at exactly the idle timeout and lost the rest of that slide entirely.
				 */
				function save(reason) {
					const now = performance.now();
					if (now - lastSave < 5000) return;
					lastSave = now;
					const slides = current
						? [...log, { n: current.n, heading: current.heading, seconds: seconds(current.start, now), open: true }]
						: [...log];
					if (!slides.length) return;
					const blob = new Blob([JSON.stringify({ reason, slides }, null, 2)], {
						type: "application/json",
					});
					const link = document.createElement("a");
					link.href = URL.createObjectURL(blob);
					link.download = "rehearsal.json";
					link.click();
					hud.dataset.saved = reason;
				}

				const started = performance.now();
				setInterval(() => {
					const total = Math.round((performance.now() - started) / 1000);
					const here = current ? Math.round((performance.now() - current.start) / 1000) : 0;
					const mm = String(Math.floor(total / 60)).padStart(2, "0");
					const ss = String(total % 60).padStart(2, "0");
					const saved = hud.dataset.saved ? `  ·  saved: ${hud.dataset.saved}` : "";
					hud.textContent = `${mm}:${ss}  ·  slide ${here}s${saved}`;
				}, 500);

				// A talk that has genuinely finished stops navigating for a long time. Ten
				// minutes, not two: two minutes on one slide is a normal slide, not the end.
				let idle;
				function armIdle() {
					clearTimeout(idle);
					idle = setTimeout(() => save("went quiet"), 600000);
				}

				Reveal.on("slidechanged", (event) => {
					open(event.currentSlide);
					armIdle();
					// The closing slide is where a run-through ends: the appendix after it is
					// optional, so waiting for the deck's real last slide would miss the moment.
					const closing = !!event.currentSlide.querySelector(".qr");
					const last = Reveal.getIndices(event.currentSlide).h === Reveal.getTotalSlides() - 1;
					if (closing || last) save(closing ? "reached the closing slide" : "reached the end");
				});
				open(Reveal.getCurrentSlide());
				armIdle();

				// Best effort when the tab goes away, so a run is not lost by closing it.
				addEventListener("pagehide", () => save("tab closed"));

				document.addEventListener("keydown", (event) => {
					if (event.key !== "r" || event.metaKey || event.ctrlKey || event.altKey) return;
					save("pressed r");
				});
			}

			Reveal.on("ready", () => {
				for (const section of document.querySelectorAll(".reveal .slides section")) {
					wrapBody(section);
					addJourney(section);
					markArtBackground(section);
				}
				externalLinksInNewTab();
				rehearsalTiming();
			});
		</script>
	</body>
</html>
